name: Post to Instagram

on:
  push:
    branches: [main]
    paths: ["queue/**"]
  workflow_dispatch:

concurrency:
  group: instagram-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish queued posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 scripts/post.py

      - name: Move published posts out of the queue
        if: always()
        run: |
          git config user.name "ig-poster"
          git config user.email "ig-poster@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Record Instagram post results [skip ci]"
          git push
