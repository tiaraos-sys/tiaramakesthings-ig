name: Post to Instagram + Facebook

on:
  schedule:
    # 2:45 pm Alaska in both standard (UTC-9) and daylight (UTC-8) time;
    # the script only posts inside the 3 pm window, once per day.
    - cron: "45 22 * * *"
    - cron: "45 23 * * *"
  workflow_dispatch:
    inputs:
      post_now:
        description: "Post the oldest queued item right now"
        type: boolean
        default: false

concurrency:
  group: instagram-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish queued post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          POST_NOW: ${{ inputs.post_now }}
        run: python3 scripts/post.py

      - name: Move published post out of the queue
        if: always()
        run: |
          git config user.name "ig-poster"
          git config user.email "ig-poster@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Record Instagram post results [skip ci]"
          git push
